<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skeleton Overlay</title>
  <style>
    :root { color-scheme: dark; --bg:#071019; --panel:#0d1925; --line:#25384a; --muted:#91a6b9; --a:#34d6ff; --b:#7bf178; --focus:#dbeafe; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:#edf5fc; font:14px/1.4 Inter,ui-sans-serif,system-ui,sans-serif; overflow:hidden; }
    button,select,input { font:inherit; }
    .app { height:100vh; display:grid; grid-template-columns:300px minmax(0,1fr); }
    aside { background:var(--panel); border-right:1px solid var(--line); padding:22px; display:flex; flex-direction:column; gap:22px; overflow:auto; }
    h1 { margin:0; font-size:20px; letter-spacing:-.02em; } .sub { margin:5px 0 0; color:var(--muted); }
    .field { display:grid; gap:7px; } label { color:#c9d7e4; font-weight:600; }
    select { width:100%; min-height:40px; padding:8px 10px; color:#edf5fc; background:#142536; border:1px solid #30475d; border-radius:7px; }
    select:focus-visible,button:focus-visible,input:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
    .swing-label { display:flex; align-items:center; gap:8px; }.dot { width:9px;height:9px;border-radius:50%;background:var(--a);box-shadow:0 0 12px var(--a); }.dot.b { background:var(--b);box-shadow:0 0 12px var(--b); }
    .compare { display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
    .compare label { cursor:pointer; } input[type=checkbox] { width:38px;height:21px;accent-color:var(--b); }
    button.primary { min-height:42px; border:0; border-radius:7px; background:#e8f4ff; color:#09131c; font-weight:750; cursor:pointer; }
    button.primary:hover { background:white; } button:disabled,select:disabled { opacity:.45;cursor:not-allowed; }
    .options { display:grid;gap:12px;padding-top:2px; }
    .option-row { display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px; }
    .option-row select { width:auto;min-width:120px;min-height:34px; }
    .metrics { display:grid;gap:10px; }
    .metrics[hidden] { display:none; }
    .metrics h2 { margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted); }
    .metric-table { width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:12px; }
    .metric-table th,.metric-table td { padding:6px 3px;border-bottom:1px solid var(--line);text-align:right; }
    .metric-table th:first-child,.metric-table td:first-child { text-align:left;color:#c9d7e4; }
    .dot.ball { background:#f8fafc; box-shadow:none; border:1px solid #64748b; }
    .viewer { min-width:0; display:grid; grid-template-rows:minmax(0,1fr) auto; position:relative; }
    .stage { position:relative; min-height:320px; overflow:hidden; } canvas { position:absolute; inset:0; display:block;width:100%;height:100%;cursor:grab;touch-action:none; } canvas:active { cursor:grabbing; }
    .hud { position:absolute;left:20px;top:18px;padding:9px 12px;border:1px solid #294159;background:#091624d9;border-radius:7px;backdrop-filter:blur(8px); }
    .hud strong { font-variant-numeric:tabular-nums; }.hud span { color:var(--muted); }
    .legend { position:absolute;right:20px;top:18px;display:flex;gap:14px;padding:9px 12px;border:1px solid #294159;background:#091624d9;border-radius:7px; }
    .legend-item { display:flex;align-items:center;gap:7px;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .viewbar { position:absolute;right:20px;top:66px;display:flex;justify-content:flex-end;flex-wrap:wrap;max-width:min(620px,calc(100% - 40px));gap:5px;padding:5px;background:#091624d9;border:1px solid #294159;border-radius:7px; }
    .viewbar button { color:#a9bbca;background:transparent;border:0;border-radius:5px;padding:6px 9px;cursor:pointer; }
    .viewbar button:hover,.viewbar button.active { color:white;background:#23394d; }
    .event-badge { position:absolute;left:20px;top:82px;color:#d7e6f2;background:#091624d9;border:1px solid #294159;border-radius:7px;padding:6px 9px;font-size:12px; }
    .event-badge[hidden] { display:none; }
    .state { position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:var(--bg);z-index:3; }
    .state[hidden] { display:none; }.state-card { max-width:520px; }.state h2 { margin:0 0 8px;font-size:22px; }.state p { color:var(--muted); }.state code { display:block;text-align:left;background:#111f2c;padding:12px 14px;border-radius:7px;color:#d9e9f7;overflow:auto; }
    .controls { background:var(--panel);border-top:1px solid var(--line);padding:13px 18px;display:grid;grid-template-columns:repeat(3,36px) minmax(150px,1fr) repeat(2,36px) auto auto;align-items:center;gap:8px; }
    .transport { width:36px;height:36px;border:1px solid #38516a;border-radius:7px;background:#162a3d;color:white;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;transition:background .15s,border-color .15s; }
    .transport:hover { background:#223c54;border-color:#4b6b8b; }
    .transport svg { display:block; }
    .timeline-bar { position:relative;width:100%;height:36px;display:flex;align-items:center; }
    .timeline-bar input[type=range] { position:relative;z-index:2;width:100%;margin:0;background:transparent;accent-color:#d9eaff;cursor:pointer; }
    .timeline-markers { position:absolute;inset:0;pointer-events:none;z-index:1; }
    .contact-marker { position:absolute;top:50%;transform:translate(-50%,-50%);width:16px;height:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;cursor:pointer;transition:transform .15s ease; }
    .contact-marker:hover { transform:translate(-50%,-50%) scale(1.25);z-index:10; }
    .contact-marker-line { width:2px;height:18px;border-radius:1px;background:var(--marker-color,#34d6ff);box-shadow:0 0 6px var(--marker-color,#34d6ff); }
    .contact-marker-pip { position:absolute;top:1px;width:7px;height:7px;border-radius:1.5px;transform:rotate(45deg);background:var(--marker-pip-top,var(--marker-color,#34d6ff));box-shadow:0 0 6px var(--marker-pip-top,var(--marker-color,#34d6ff)); }
    .contact-marker-pip.bottom { top:auto;bottom:1px;background:var(--marker-pip-bottom,var(--marker-color,#34d6ff));box-shadow:0 0 6px var(--marker-pip-bottom,var(--marker-color,#34d6ff)); }
    .contact-marker.dual .contact-marker-line { background:linear-gradient(180deg,#34d6ff 0%,#7bf178 100%);box-shadow:0 0 6px rgba(52,214,255,.5); }
    .counter { color:var(--muted);font-variant-numeric:tabular-nums;min-width:85px;text-align:right; }
    .speed { width:auto;min-height:34px; }
    @media (max-width:760px) { body{overflow:auto}.app{height:auto;min-height:100vh;grid-template-columns:1fr;grid-template-rows:auto minmax(520px,70vh)} aside{border-right:0;border-bottom:1px solid var(--line);padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px}aside header,.compare,.primary,.options,.metrics{grid-column:1/-1}.viewer{min-height:520px}.legend{left:14px;right:auto;top:auto;bottom:14px;flex-direction:column}.controls{grid-template-columns:repeat(3,36px) 1fr repeat(2,36px) auto}.speed{display:none} }
    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; } }
  </style>
</head>
<body>
<div class="app">
  <aside>
    <header><h1>Skeleton Overlay</h1><p class="sub">Compare one or two recorded swings.</p></header>
    <div class="field"><label class="swing-label" for="trialA"><span class="dot"></span>Swing A</label><select id="trialA" aria-label="Swing A"></select></div>
    <div class="compare"><label for="compare">Overlay a second swing</label><input id="compare" type="checkbox" role="switch"></div>
    <div class="field"><label class="swing-label" for="trialB"><span class="dot b"></span>Swing B</label><select id="trialB" aria-label="Swing B" disabled></select></div>
    <button class="primary" id="load" type="button">Load skeleton</button>
    <div class="options">
      <div class="option-row"><label for="sync">Synchronize at</label><select id="sync"><option value="contact">Estimated contact</option><option value="swingStart">Swing start</option><option value="peakSpeed">Peak bat speed</option><option value="percentage">Recording percentage</option></select></div>
      <div class="option-row"><label for="align">Spatial alignment</label><select id="align"><option value="hips" selected>Each other's hips (at sync)</option><option value="hipsStance">Each other's hips (stance)</option><option value="plate">Home plate</option></select></div>
      <div class="option-row"><label for="matchSize">Match player size</label><input id="matchSize" type="checkbox" role="switch"></div>
      <div class="option-row"><label for="showPlate">Show home plate</label><input id="showPlate" type="checkbox" role="switch" checked></div>
      <div class="option-row"><label for="trails">Motion trails</label><input id="trails" type="checkbox" role="switch" checked></div>
      <div class="option-row"><label for="showBall">Show estimated ball</label><input id="showBall" type="checkbox" role="switch"></div>
    </div>
    <section class="metrics" id="metrics" aria-live="polite" hidden></section>
  </aside>
  <section class="viewer" aria-label="Motion viewer">
    <div class="stage">
      <canvas id="canvas" aria-label="Animated three-dimensional skeleton overlay"></canvas>
      <div class="hud"><strong id="time">0.000 s</strong><br><span id="progress">0%</span></div>
      <div class="legend" id="legend" hidden></div>
      <div class="event-badge" id="eventBadge" hidden></div>
      <div class="viewbar" aria-label="Camera views">
        <button type="button" data-view="catcher">Behind plate</button>
        <button type="button" class="active" data-view="pitcher">Pitcher</button>
        <button type="button" data-view="left">Left side</button>
        <button type="button" data-view="right">Right side</button>
        <button type="button" data-view="top">Top</button>
      </div>
      <div class="state" id="state"><div class="state-card"><h2>Finding local C3D trials…</h2><p>The files stay on this computer.</p></div></div>
    </div>
    <div class="controls">
      <button class="transport" id="previousEvent" type="button" aria-label="Previous swing event"><svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><rect x="2" y="2.5" width="2" height="11" rx="0.75"/><path d="M13 3.24a.8.8 0 0 0-1.24-.67L5.5 6.94a.8.8 0 0 0 0 1.34l6.26 4.37a.8.8 0 0 0 1.24-.67V3.24z"/></svg></button>
      <button class="transport" id="stepBack" type="button" aria-label="Previous frame"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3.5L5.5 8l4.5 4.5"/></svg></button>
      <button class="transport" id="play" type="button" aria-label="Play"><svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M4.5 3.24a.8.8 0 0 1 1.24-.67l7.5 4.76a.8.8 0 0 1 0 1.34l-7.5 4.76a.8.8 0 0 1-1.24-.67V3.24z"/></svg></button>
      <div class="timeline-bar">
        <input id="timeline" type="range" min="0" max="1000" value="0" aria-label="Motion timeline">
        <div class="timeline-markers" id="timelineMarkers" aria-hidden="true"></div>
      </div>
      <button class="transport" id="stepForward" type="button" aria-label="Next frame"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5"/></svg></button>
      <button class="transport" id="nextEvent" type="button" aria-label="Next swing event"><svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M3 3.24a.8.8 0 0 1 1.24-.67l6.26 4.37a.8.8 0 0 1 0 1.34L4.24 12.65A.8.8 0 0 1 3 11.98V3.24z"/><rect x="12" y="2.5" width="2" height="11" rx="0.75"/></svg></button>
      <span class="counter" id="counter">0 / 0</span>
      <select class="speed" id="speed" aria-label="Playback speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
    </div>
  </section>
</div>
<script>
const $=s=>document.querySelector(s), canvas=$('#canvas'),ctx=canvas.getContext('2d');
const ui={a:$('#trialA'),b:$('#trialB'),compare:$('#compare'),load:$('#load'),state:$('#state'),play:$('#play'),timeline:$('#timeline'),timelineMarkers:$('#timelineMarkers'),speed:$('#speed'),legend:$('#legend'),time:$('#time'),progress:$('#progress'),counter:$('#counter'),sync:$('#sync'),align:$('#align'),matchSize:$('#matchSize'),showPlate:$('#showPlate'),trails:$('#trails'),showBall:$('#showBall'),metrics:$('#metrics'),eventBadge:$('#eventBadge'),previousEvent:$('#previousEvent'),nextEvent:$('#nextEvent'),stepBack:$('#stepBack'),stepForward:$('#stepForward')};
let rawMotions=[],motions=[],sceneBounds={center:[0,0,0],extent:1},playing=false,phase=0,last=performance.now(),azimuth=-Math.PI/2,elevation=.04,zoom=1,drag=null;
window.viewer={get motions(){return motions;},get rawMotions(){return rawMotions;},get phase(){return phase;},set phase(v){phase=v;pause();draw();},get alignMode(){return ui.align?ui.align.value:'hips';},set alignMode(v){if(ui.align){ui.align.value=v;updateAlignment();}},get matchSize(){return ui.matchSize?ui.matchSize.checked:false;},set matchSize(v){if(ui.matchSize){ui.matchSize.checked=v;updateAlignment();}},setView(az,el,z=1){azimuth=az;elevation=el;zoom=z;draw();},draw,pause};
const VIEWS={catcher:[Math.PI/2,.08,1],pitcher:[-Math.PI/2,.04,1],left:[0,.06,1],right:[Math.PI,.06,1],top:[0,Math.PI/2-.02,.9]};
const COLORS=['#34d6ff','#7bf178'];
const JOINTS={
  head:['LFHD','RFHD','LBHD','RBHD'],neck:['C7','CLAV'],chest:['C7','CLAV','STRN','T10'],pelvis:['LASI','RASI','LPSI','RPSI'],
  ls:['LSHO'],le:['LELB','LMELB'],lw:['LWRA','LWRB'],lh:['LFIN'],rs:['RSHO'],re:['RELB','RMELB'],rw:['RWRA','RWRB'],rh:['RFIN'],
  lhip:['LASI','LPSI'],lk:['LKNE','LMKNE'],la:['LANK','LMANK'],lf:['LHEE','LTOE'],rhip:['RASI','RPSI'],rk:['RKNE','RMKNE'],ra:['RANK','RMANK'],rf:['RHEE','RTOE']
};
const BONES=[['head','neck'],['neck','chest'],['chest','pelvis'],['neck','ls'],['ls','le'],['le','lw'],['lw','lh'],['neck','rs'],['rs','re'],['re','rw'],['rw','rh'],['pelvis','lhip'],['lhip','lk'],['lk','la'],['la','lf'],['pelvis','rhip'],['rhip','rk'],['rk','ra'],['ra','rf'],['ls','rs'],['lhip','rhip']];
function showState(title,message,command=''){if(ui.timelineMarkers)ui.timelineMarkers.innerHTML='';ui.state.hidden=false;ui.state.innerHTML=`<div class="state-card"><h2>${title}</h2><p>${message}</p>${command?`<code>${command}</code>`:''}</div>`}
function hideState(){ui.state.hidden=true}
async function json(url){const response=await fetch(url);const body=await response.json();if(!response.ok)throw new Error(body.error||`Request failed: ${response.status}`);return body}
function fillSelect(select,trials){select.innerHTML=trials.map(t=>`<option value="${encodeURIComponent(t.path)}">${t.path}</option>`).join('')}
async function initialize(){try{const {trials}=await json('/api/trials');if(!trials.length){showState('No hitting C3Ds found','Download the release data, then restart this application.','scripts/download_data.sh --discipline hitting');ui.load.disabled=true;return}fillSelect(ui.a,trials);fillSelect(ui.b,trials);if(trials.length>1)ui.b.selectedIndex=1;showState('Choose a swing','Select one trial—or enable a second overlay—then load the skeleton.');}catch(e){showState('Could not read local trials',e.message)}}
ui.compare.onchange=()=>{ui.b.disabled=!ui.compare.checked;ui.load.textContent=ui.compare.checked?'Load overlay':'Load skeleton'};
const HOME_PLATE_VERTS=[
  [-0.4318,-0.2159],
  [-0.2159,-0.4318],
  [0.0,-0.4318],
  [0.0,0.0],
  [-0.2159,0.0]
];
function athleteHeight(raw){
  if(Number.isFinite(raw.athleteHeightIn)&&raw.athleteHeightIn>0)return raw.athleteHeightIn;
  const headIdxs=['LFHD','RFHD','LBHD','RBHD'].map(l=>raw.labels?.indexOf(l)).filter(i=>i>=0);
  const ground=raw.ground??0;
  let maxHeadZ=-Infinity;
  for(const f of (raw.frames||[]).slice(0,Math.min(60,raw.frames.length))){
    for(const idx of headIdxs){const p=f[idx];if(p&&Number.isFinite(p[2]))maxHeadZ=Math.max(maxHeadZ,p[2]);}
  }
  return Number.isFinite(maxHeadZ)?Math.round(((maxHeadZ-ground+0.09)/0.0254)*10)/10:null;
}
function computeHipOrigin(m,frameIndex){
  const anchors=m.anchor||[];
  let frame=null;
  if(frameIndex!==undefined&&frameIndex!==null&&m.frames[frameIndex]){
    const candidate=m.frames[frameIndex];
    if(anchors.some(i=>candidate[i]?.every(Number.isFinite)))frame=candidate;
  }
  if(!frame){
    frame=m.frames.find(f=>anchors.some(i=>f[i]?.every(Number.isFinite)))||m.frames[0];
  }
  let origin=[0,0,0];
  const valid=anchors.map(i=>frame[i]).filter(p=>p?.every(Number.isFinite));
  if(valid.length)origin=origin.map((_,axis)=>valid.reduce((s,p)=>s+p[axis],0)/valid.length);
  return origin;
}
function updateAlignment(){
  if(!rawMotions.length)return;
  const mode=ui.align?ui.align.value:'hips';
  const syncKey=ui.sync?ui.sync.value:'contact';
  const matchSize=!!(ui.matchSize&&ui.matchSize.checked&&rawMotions.length>1);
  const refHeight=matchSize?(athleteHeight(rawMotions[0])||70):null;
  const scales=rawMotions.map((raw,idx)=>{
    if(!matchSize||idx===0)return 1;
    const h=athleteHeight(raw)||70;
    return(refHeight&&h>0)?(refHeight/h):1;
  });
  motions=rawMotions.map((raw,idx)=>{
    let anchorFrame=0;
    if(mode==='hips'&&syncKey!=='percentage'){
      const evt=raw.analysis?.events?.[syncKey];
      if(Number.isFinite(evt))anchorFrame=evt;
    }
    const hipOrig=computeHipOrigin(raw,anchorFrame);
    const scale=scales[idx];
    const rawGround=raw.ground??0;
    const centerX=hipOrig[0],centerY=hipOrig[1],centerZ=rawGround;
    const scalePt=p=>{
      if(!p||!p.every(Number.isFinite))return p;
      if(scale===1)return p;
      return[centerX+(p[0]-centerX)*scale,centerY+(p[1]-centerY)*scale,centerZ+(p[2]-centerZ)*scale];
    };
    let origin=[0,0,0];
    if(mode==='hips'||mode==='hipsStance'){
      origin=[centerX,centerY,0];
    }
    const move=p=>{
      if(!p||!p.every(Number.isFinite))return p;
      const sp=scale!==1?scalePt(p):p;
      return[sp[0]-origin[0],sp[1]-origin[1],sp[2]-rawGround];
    };
    return{
      ...raw,
      origin,
      scale,
      frames:raw.frames.map(frame=>frame.map(move)),
      ball:(raw.ball||Array(raw.frames.length).fill(null)).map(move),
      batPoses:(raw.batPoses||[]).map(pose=>pose?{grip:move(pose.grip),barrel:move(pose.barrel)}:null),
      ground:0
    };
  });
  sceneBounds=bounds();
  renderTimelineMarkers();
  renderLegend();
  renderMetrics();
  draw();
}
function drawHomePlate(b,w,h){
  if(!motions.length)return null;
  const mode=ui.align?ui.align.value:'hips';
  const groundZ=0;
  const plateOffset=(mode==='hips'||mode==='hipsStance')?(motions[0]?.origin||[0,0,0]):[0,0,0];
  const pts3D=HOME_PLATE_VERTS.map(([vx,vy])=>[vx-plateOffset[0],vy-plateOffset[1],groundZ+0.002]);
  const pts2D=pts3D.map(p=>project(p,w,h,b,false));
  if(pts2D.some(p=>!p))return null;
  const avgDepth=pts2D.reduce((s,p)=>s+p[2],0)/pts2D.length;
  return{
    depth:avgDepth+0.015,
    paint:()=>{
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(pts2D[0][0],pts2D[0][1]);
      for(let i=1;i<pts2D.length;i++)ctx.lineTo(pts2D[i][0],pts2D[i][1]);
      ctx.closePath();
      ctx.fillStyle='#06111b';
      ctx.fill();
      ctx.strokeStyle='#06111b';
      ctx.lineWidth=4;
      ctx.lineJoin='round';
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(pts2D[0][0],pts2D[0][1]);
      for(let i=1;i<pts2D.length;i++)ctx.lineTo(pts2D[i][0],pts2D[i][1]);
      ctx.closePath();
      ctx.fillStyle='#f8fafc';
      ctx.globalAlpha=0.92;
      ctx.fill();
      ctx.strokeStyle='#cbd5e1';
      ctx.lineWidth=1.2;
      ctx.stroke();
      ctx.restore();
    }
  };
}
function bounds(){
  const low=[Infinity,Infinity,Infinity],high=[-Infinity,-Infinity,-Infinity];
  for(const motion of motions)for(const frame of motion.frames)for(const point of frame)if(point?.every(Number.isFinite))for(let axis=0;axis<3;axis++){low[axis]=Math.min(low[axis],point[axis]);high[axis]=Math.max(high[axis],point[axis])}
  if(motions.length&&(!ui.showPlate||ui.showPlate.checked)){
    const mode=ui.align?ui.align.value:'hips',groundZ=0;
    const plateOffset=(mode==='hips'||mode==='hipsStance')?(motions[0]?.origin||[0,0,0]):[0,0,0];
    for(const [vx,vy] of HOME_PLATE_VERTS){const px=vx-plateOffset[0],py=vy-plateOffset[1],pz=groundZ;low[0]=Math.min(low[0],px);high[0]=Math.max(high[0],px);low[1]=Math.min(low[1],py);high[1]=Math.max(high[1],py);low[2]=Math.min(low[2],pz);high[2]=Math.max(high[2],pz);}
  }
  const center=low.map((v,i)=>(v+high[i])/2),extent=Math.max(...low.map((v,i)=>Math.max(0.6,(high[i]-v)/2)));
  return{center,extent};
}
function drawGround(b,w,h){
  const z=0,size=b.extent*1.2,step=size/6;
  for(let i=-6;i<=6;i++){
    const d=i*step;
    line(project([b.center[0]-size,b.center[1]+d,z],w,h,b),project([b.center[0]+size,b.center[1]+d,z],w,h,b),'#496175',1,i===0?.55:.22);
