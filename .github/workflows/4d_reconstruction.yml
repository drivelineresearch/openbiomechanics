name: 4D reconstruction CPU checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check --isolated --select E4,E7,E9,F,I computer_vision/4d_reconstruction
      - run: ruff format --isolated --check computer_vision/4d_reconstruction
      - run: python -m unittest discover -s computer_vision/4d_reconstruction/tests -v
      - run: python -m compileall -q computer_vision/4d_reconstruction
      - run: bash -n computer_vision/4d_reconstruction/run_all.sh computer_vision/4d_reconstruction/setup_env.sh
      - run: shellcheck computer_vision/4d_reconstruction/run_all.sh computer_vision/4d_reconstruction/setup_env.sh
