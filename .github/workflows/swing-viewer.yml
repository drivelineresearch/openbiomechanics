name: Swing viewer

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: ruff check --isolated --select E4,E7,E9,F,I swing_visualizer tests/browser
      - run: ruff format --isolated --check swing_visualizer tests/browser
      - run: python tests/browser/swing_viewer_smoke.py
