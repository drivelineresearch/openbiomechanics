name: Calibration safeguards

on:
  pull_request:
    paths:
      - "computer_vision/calibration/**"
      - ".github/workflows/calibration.yml"
  push:
    branches: [main]
    paths:
      - "computer_vision/calibration/**"
      - ".github/workflows/calibration.yml"

permissions:
  contents: read

jobs:
  calibration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: computer_vision/calibration/requirements.txt
      - run: python -m pip install -r computer_vision/calibration/requirements.txt
      - run: python -m unittest discover -s computer_vision/calibration/tests -v
      - run: python -m compileall -q computer_vision/calibration/scripts
      - name: Validate committed result files
        run: |
          for file in computer_vision/calibration/results/*.json; do
            python -m json.tool "$file" >/dev/null
          done
      - name: Rebuild deterministic pose graph
        run: |
          python computer_vision/calibration/scripts/build_pose_graph.py
          git diff --exit-code -- computer_vision/calibration/results/optitrack_rig_provisional.json
