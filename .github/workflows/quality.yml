name: Repository quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-surface:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install public analysis dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check Python style
        run: |
          ruff check obp examples scripts tests computer_vision/hello_world computer_vision/utils.py
          ruff format --check obp examples scripts tests computer_vision/hello_world computer_vision/utils.py

      - name: Test loaders, schemas, docs/workflows, and release metadata
        run: python -m unittest discover -s tests -v

      - name: Verify generated data dictionaries
        run: python scripts/build_data_dictionary.py --check

      - name: Compile public Python sources
        run: python -m compileall -q obp examples scripts computer_vision

      - name: Validate shell and notebook syntax
        shell: bash
        run: |
          bash -n scripts/download_data.sh
          shellcheck scripts/download_data.sh
          while IFS= read -r notebook; do
            python -m json.tool "$notebook" >/dev/null
          done < <(git ls-files '*.ipynb')

      - name: Smoke-test fresh-clone examples
        run: |
          python examples/01_explore_poi.py
          python examples/02_read_c3d.py
          python examples/03_join_fullsig.py
          python examples/04_hp_assessment.py
          python computer_vision/hello_world/face_image.py --help
          python computer_vision/hello_world/face_video.py --help
          python computer_vision/hello_world/face_tracking.py --help
