name: Gaussian splat CPU checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: ruff check --isolated --select E4,E7,E9,F,I computer_vision/splat
      - run: ruff format --isolated --check computer_vision/splat
      - run: python -m unittest discover -s computer_vision/splat/tests -v
      - run: python -m compileall -q computer_vision/splat
      - run: bash -n computer_vision/splat/run_all.sh computer_vision/splat/setup_env.sh
      - run: shellcheck computer_vision/splat/run_all.sh computer_vision/splat/setup_env.sh
