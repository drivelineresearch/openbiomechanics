version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # Requirements are >= minimums, so only raise one when the latest release no
  # longer satisfies it. Security updates are configured separately and still
  # raise minimums for advisories.
  - package-ecosystem: pip
    directories:
      - /
      - /baseball_pitching/code
      - /baseball_hitting/code
      - /high_performance/code
      - /computer_vision
      - /computer_vision/calibration
    schedule:
      interval: monthly
    versioning-strategy: increase-if-necessary
    groups:
      python:
        patterns: ["*"]
    ignore:
      # Exact pins that reproduce the committed calibration artifacts.
      - dependency-name: numpy
      - dependency-name: opencv-python-headless
      # Built against torch 2.6 / cu124 in the splat and 4D setup_env.sh scripts.
      - dependency-name: gsplat
